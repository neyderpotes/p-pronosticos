<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a1110">
<title>P-PRONOSTICOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de una pantalla — cabecera fija con la marca, contenido desplazable, barra inferior de 6 secciones. Estadio de noche, líneas de cal, foco ámbar. */
:root{
  --bg:#0a1110; --surface:#121c19; --surface2:#182521; --line:#22312c;
  --fg:#e9f0ec; --muted:#8ba198; --accent:#f2c14e; --accent2:#3ee0a8;
  --home:#4fd1a5; --draw:#9aa5a0; --away:#7aa7ff; --live:#ff5d5d; --ok:#4fd1a5; --bad:#ff7a6b; --warn:#f2c14e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef3f0; --surface:#ffffff; --surface2:#f3f7f5; --line:#d8e2dd; --fg:#0f1a16; --muted:#586b63; --accent:#a87a06; --accent2:#0f8f66;
  --home:#11866a; --draw:#7b8681; --away:#2d5fc6; --live:#d93636; --ok:#11866a; --bad:#c8402f; --warn:#a87a06; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#eef3f0; --surface:#ffffff; --surface2:#f3f7f5; --line:#d8e2dd; --fg:#0f1a16; --muted:#586b63; --accent:#a87a06; --accent2:#0f8f66;
  --home:#11866a; --draw:#7b8681; --away:#2d5fc6; --live:#d93636; --ok:#11866a; --bad:#c8402f; --warn:#a87a06; color-scheme:light }
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 9px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{width:30px;height:30px;flex:none}
.brand h1{margin:0;font:italic 800 25px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.brand h1 b{color:var(--accent);font-weight:800}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
.view{display:flex;flex-direction:column;gap:14px}
.view.anim{animation:in .2s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.anim,.spin svg,.dot,.splash .mark{animation:none!important}}
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);position:relative;text-align:center}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--live);color:#fff;font:700 10px/16px var(--body)}
.splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
.splash .mark{width:84px;height:84px;animation:pulse2 1.4s ease-in-out infinite}
.splash h2{margin:0;font:italic 800 40px/1 var(--display);text-transform:uppercase}
.splash h2 b{color:var(--accent)}
.splash p{margin:0;color:var(--muted);font-size:13px}
@keyframes pulse2{50%{transform:scale(.94);opacity:.8}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font:600 13.5px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip img{width:16px;height:16px;object-fit:contain}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px dashed var(--accent);color:var(--fg)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 -6px}
.sec h3,.day{margin:0;font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sec button{font-size:13px;color:var(--accent);font-weight:600}
.day{margin:6px 0 -6px}
.list{display:flex;flex-direction:column;gap:8px}
.match{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;transition:transform .12s}
.match:active{transform:scale(.985)}
.match.is-live{border-color:color-mix(in srgb,var(--live) 55%,var(--line))}
.mmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:7px}
.comp{font:600 11.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface2);display:inline-flex;align-items:center;gap:5px;min-width:0;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.comp img{width:13px;height:13px;object-fit:contain}
.livebadge{color:var(--live);font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.st-post{color:var(--muted);font-weight:600}
.st-off{color:var(--warn);font-weight:600}
.trow{display:flex;align-items:center;gap:10px;padding:3px 0;min-width:0}
.logo{width:24px;height:24px;flex:none;object-fit:contain}
.ini{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font:700 9px/1 var(--display)}
.tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tn.win{font-weight:700}
.sc{font:700 21px/1 var(--display);min-width:20px;text-align:right}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{color:var(--accent);transform:scale(1.25)}100%{transform:none}}
.pbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:9px;gap:2px}
.pbar i{display:block;height:100%}
.ph{background:var(--home)}.pd{background:var(--draw)}.pa{background:var(--away)}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.plab b{color:var(--fg);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font:700 17px/1.15 var(--display);text-transform:uppercase;letter-spacing:.07em;text-wrap:balance}
.card h2 small{font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
.back{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;padding:16px 10px;background:radial-gradient(120% 90% at 50% 0%,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--line);opacity:.7}
.hero .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative;z-index:1}
.hero .t img,.hero .t .ini{width:52px;height:52px;font-size:14px}
.hero .t span{font:600 16px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.hero .mid{position:relative;z-index:1;background:var(--surface);padding:6px 10px;border-radius:10px;border:1px solid var(--line);min-width:84px}
.hero .big{font:700 38px/1 var(--display)}
.hero .sub{font-size:12px;color:var(--muted);margin-top:3px}
.tabsbar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabsbar::-webkit-scrollbar{display:none}
.tabsbar button{flex:none;padding:9px 11px;font:600 13.5px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabsbar button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.x12{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.x12>div{border-radius:10px;padding:10px 6px;text-align:center;background:var(--surface2);border-top:3px solid}
.x12 .k{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x12 .v{font:700 29px/1.05 var(--display)}
.x12 .o{font-size:11px;color:var(--muted)}
.pick{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.pick .ph1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pick .mk{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:600}
.pick .sel{font:700 18px/1.15 var(--display)}
.pick .pp{font:700 24px/1 var(--display);text-align:right;white-space:nowrap}
.pick .pp small{display:block;font:500 11px var(--body);color:var(--muted)}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.conf{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px}
.conf.alta{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.conf.media{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.conf.baja{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
details.why{font-size:13px}
details.why summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
details.why summary::-webkit-details-marker{display:none}
.why ul{margin:6px 0 0;padding-left:18px}
.why li{margin:2px 0}
.why .fav{color:var(--ok)}.why .risk{color:var(--bad)}
.xg{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.xg b{font:700 24px var(--display);color:var(--fg)}
.grid-wrap{overflow-x:auto}
.hm{display:grid;grid-template-columns:28px repeat(6,minmax(34px,1fr));gap:3px;font-size:12px;min-width:260px}
.hm span{display:grid;place-items:center;height:32px;border-radius:6px}
.hm .ax{color:var(--muted);font:600 12px var(--display)}
.hm .c{color:var(--fg);font-weight:600;font-size:11px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.tops{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tops span{background:var(--surface2);border-radius:8px;padding:5px 9px;font-size:13px}
.tops b{font-family:var(--display);font-size:16px;margin-right:4px}
.stat{padding:9px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0;padding-top:0}
.stat .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .hd b{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.06em}
.stat .hd small{color:var(--muted);font-size:12px}
.dv{display:grid;grid-template-columns:40px 1fr 1fr 40px;align-items:center;gap:6px;margin:6px 0}
.dv .n{font:700 17px var(--display)}
.dv .n:last-child{text-align:right}
.dv .bl,.dv .br{height:9px;background:var(--surface2);border-radius:5px;display:flex;overflow:hidden}
.dv .bl{justify-content:flex-end}
.dv .bl i{background:var(--home);border-radius:5px}
.dv .br i{background:var(--away);border-radius:5px}
.lines{display:flex;gap:6px;flex-wrap:wrap}
.lines span{font-size:12px;background:var(--surface2);border-radius:7px;padding:4px 8px;color:var(--muted)}
.lines b{color:var(--fg)}
.form{display:flex;gap:4px;align-items:center}
.form i{width:21px;height:21px;border-radius:5px;display:grid;place-items:center;font:700 11.5px/1 var(--display);font-style:normal;color:#0b1210}
.fW{background:var(--home)}.fD{background:var(--draw)}.fL{background:var(--live)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .tn{font-size:14px}
button.frow{width:100%}
.ai p{margin:0 0 8px;max-width:65ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;background:var(--accent);color:#14110a;font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 11px;font-size:13px}
.btn[disabled]{opacity:.5}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 11.5px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
td .trow{padding:0;gap:8px}
td .logo,td .ini{width:20px;height:20px}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr[data-team]{cursor:pointer}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=password],input[type=search]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:15px var(--body)}
.simgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.simgrid{grid-template-columns:1fr}}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.chart svg{width:100%;height:auto;display:block}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 10px;color:var(--muted);font-size:14px}
.loading::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.err{padding:12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--fg);font-size:13px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lgcard{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0;text-align:left}
.lgcard img,.lgcard .ini{width:30px;height:30px;object-fit:contain;flex:none}
.lgcard div{min-width:0}
.lgcard b{display:block;font:600 15px/1.15 var(--display);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.lgcard small{color:var(--muted);font-size:12px}
.lgcard .cnt{margin-left:auto;font:700 13px var(--display);color:var(--live)}
.lgcard.off{opacity:.65}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{background:var(--surface2);border-radius:10px;padding:9px 10px}
.tile .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--display);font-weight:600}
.tile .v{font:700 22px/1.1 var(--display)}
.tile .v.na{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500}
.thead{display:flex;align-items:center;gap:14px}
.thead img,.thead .ini{width:64px;height:64px;object-fit:contain;flex:none;font-size:16px}
.thead .photo{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--surface2);border:1px solid var(--line)}
.thead h2{margin:0;font:700 24px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.thead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.star{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);margin-left:auto;flex:none}
.star svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none}
.star[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.star[aria-pressed="true"] svg{fill:var(--accent)}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:44px 26px 1fr;gap:6px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev .m{font:700 15px var(--display);color:var(--muted)}
.ev .i{font-size:16px;line-height:1.2;text-align:center}
.ev .x small{display:block;color:var(--muted);font-size:12px}
.ev.side-a .x{color:var(--fg)}
.ev.goal .m{color:var(--accent)}
.ev.new{animation:flashbg 2.4s ease-out}
@keyframes flashbg{0%{background:color-mix(in srgb,var(--accent) 25%,transparent)}100%{background:transparent}}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pitch-wrap{border-radius:14px;overflow:hidden;background:#2f6b3a;max-width:480px;margin:0 auto}
.pbar2{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#24552d;color:#fff;font-size:14px}
.pbar2 .trow{display:flex;align-items:center;gap:8px}.pbar2 .logo,.pbar2 .ini{width:22px;height:22px}
.pbar2 .fm{background:#174a22;color:#9df0b4;font:700 12px var(--display);padding:3px 8px;border-radius:7px}
.pitch{position:relative;aspect-ratio:.56;background:repeating-linear-gradient(180deg,#3a7d45 0 9.09%,#357340 9.09% 18.18%)}
.pl-lines i{position:absolute;border:2px solid rgba(255,255,255,.35)}
.pl-lines .half{left:0;right:0;top:50%;border-width:2px 0 0}
.pl-lines .circ{left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.pl-lines .box{left:21%;right:21%;height:13%}.pl-lines .box.t{top:0;border-top:0}.pl-lines .box.b{bottom:0;border-bottom:0}
.pl-lines .six{left:37%;right:37%;height:4.5%}.pl-lines .six.t{top:0;border-top:0}.pl-lines .six.b{bottom:0;border-bottom:0}
.pl-lines .arc{left:50%;width:20%;aspect-ratio:2;transform:translateX(-50%);border-radius:0 0 999px 999px;border-top:0}

<script>
'use strict';
/* =========================================================
   P-PRONOSTICOS · versión 2.0.0
   Fuente de datos: ESPN (API pública, sin clave).
   ========================================================= */
const VERSION='2.1.0';
const SITE='https://site.api.espn.com/apis/site/v2/sports/';
const V2='https://site.api.espn.com/apis/v2/sports/';
const WEB='https://site.web.api.espn.com/apis/common/v3/sports/';
const DAY=864e5, HOUR=36e5, MIN=6e4;

/* ---------- Catálogo de competiciones (para agregar una nueva, añade una línea aquí) ---------- */
const CATS=[
  {id:'col',name:'Fútbol · Colombia',items:[
    {k:'soccer/col.1',name:'Liga BetPlay Dimayor',country:'Colombia'},
    {k:'soccer/col.2',name:'Torneo BetPlay Dimayor',country:'Colombia',note:'Segunda división (Primera B)'},
    {k:'soccer/col.copa',name:'Copa BetPlay Dimayor',country:'Colombia'}]},
  {id:'eur',name:'Fútbol · Europa',items:[
    {k:'soccer/uefa.champions',name:'Champions League',country:'Europa'},
    {k:'soccer/esp.1',name:'LaLiga',country:'España'},
    {k:'soccer/eng.1',name:'Premier League',country:'Inglaterra'},
    {k:'soccer/ger.1',name:'Bundesliga',country:'Alemania'},
    {k:'soccer/ita.1',name:'Serie A',country:'Italia'},
    {k:'soccer/fra.1',name:'Ligue 1',country:'Francia'},
    {k:'soccer/eng.league_cup',name:'Copa EFL',country:'Inglaterra'}]},
  {id:'sud',name:'Fútbol · Sudamérica',items:[
    {k:'soccer/conmebol.libertadores',name:'Copa Libertadores',country:'Sudamérica'},
    {k:'soccer/conmebol.sudamericana',name:'Copa Sudamericana',country:'Sudamérica'},
    {k:'soccer/arg.1',name:'Liga Profesional Argentina',country:'Argentina'},
    {k:'soccer/arg.copa',name:'Copa Argentina',country:'Argentina'}]},
  {id:'otros',name:'Fútbol · Otros torneos',items:[
    {k:'soccer/usa.1',name:'MLS',country:'Estados Unidos'}]},
  {id:'bask',name:'Baloncesto',items:[{k:'basketball/nba',name:'NBA',country:'Estados Unidos'}]},
  {id:'amer',name:'Fútbol americano',items:[{k:'football/nfl',name:'NFL',country:'Estados Unidos'}]},
  {id:'motor',name:'Automovilismo',items:[{k:'racing/f1',name:'Fórmula 1',country:'Mundial'}]},
  {id:'esp',name:'Deportes electrónicos',items:[
    {k:'esports/general',name:'E-sports',off:true},
    {k:'esports/soccer',name:'Esports Fútbol',off:true},
    {k:'esports/basketball',name:'Esports Baloncesto',off:true}]}
];
const LEAGUES={};CATS.forEach(c=>c.items.forEach(it=>{const [sport,slug]=it.k.split('/');LEAGUES[it.k]=Object.assign({sport,slug,cat:c.id},it)}));
const SOCCER=Object.values(LEAGUES).filter(l=>l.sport==='soccer').map(l=>l.k);
const POPULAR=['soccer/col.1','soccer/uefa.champions','soccer/esp.1','soccer/eng.1','soccer/conmebol.libertadores','basketball/nba'];
const SP={soccer:'s',basketball:'b',football:'f',racing:'r'};

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z2=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+z2(d.getMonth()+1)+z2(d.getDate())};
const ym=d=>{d=new Date(d);return d.getFullYear()+z2(d.getMonth()+1)};
const pct=p=>Math.round(p*100)+'%';
const odd=p=>p>0.005?(1/p).toFixed(2):'—';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:NaN};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtTime=d=>new Date(d).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const fmtDate=d=>new Date(d).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
const ago=t=>{if(!t)return'—';const s=(Date.now()-t)/1000;if(s<60)return'hace segundos';if(s<3600)return'hace '+Math.round(s/60)+' min';if(s<86400)return'hace '+Math.round(s/3600)+' h';return'hace '+Math.round(s/86400)+' d'};
function dayLabel(ms){const d=new Date(ms);d.setHours(0,0,0,0);const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((d-t)/DAY);
  if(diff===0)return'Hoy';if(diff===1)return'Mañana';if(diff===-1)return'Ayer';return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'short'})}
const store={get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const fact=[1];for(let i=1;i<60;i++)fact[i]=fact[i-1]*i;
const pois=(k,l)=>Math.exp(-l)*Math.pow(l,k)/fact[Math.min(k,59)];
function overP(lambda,line){let c=0;for(let k=0;k<=Math.floor(line);k++)c+=pois(k,lambda);return clamp(1-c,0,1)}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());

/* ---------- Red: caché en memoria, sin consultas duplicadas, reintentos ---------- */
const PROXIES=[u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
let LASTERR='',NETOK=0,NETFAIL=0,BYTES=0;
const MEM=new Map(),INFLIGHT=new Map();
async function rawJSON(url){
  const r=await fetch(url);
  if(!r.ok){const er=new Error('HTTP '+r.status);er.status=r.status;throw er}
  const t=await r.text();BYTES+=t.length;return JSON.parse(t);
}
/* Espejo de ESPN: si el servidor principal falla, se intenta el mismo dato en site.web.api.espn.com */
const MIRROR=u=>u.startsWith('https://site.api.espn.com/')?u.replace('https://site.api.espn.com/','https://site.web.api.espn.com/'):'';
async function getJSON(url){
  for(let a=0;a<3;a++){
    const u=a===1&&MIRROR(url)?MIRROR(url):url;
    try{const j=await rawJSON(u);NETOK++;if(typeof PROVOK==='function'&&/espn\.com/.test(u))PROVOK(u===url?'espn':'espn2');return j}catch(e){LASTERR=(e&&e.message)||'error de red';
      if(typeof PROVERR==='function'&&/espn\.com/.test(u))PROVERR(u===url?'espn':'espn2',e);
      if(e.status===429||e.status>=500||(!e.status&&MIRROR(url))){await sleep(1200*(a+1));continue}
      if(e.status){NETFAIL++;throw e}break}
  }
  if(!isNative()){for(const p of PROXIES){try{const j=await rawJSON(p(url));NETOK++;return j}catch(e){}}}
  NETFAIL++;throw new Error(LASTERR);
}
/* api(url,{ttl}) — devuelve de memoria si es reciente; une peticiones iguales simultáneas */
function api(url,ttl){
  ttl=ttl??60e3;const m=MEM.get(url);
  if(m&&Date.now()-m.t<ttl)return Promise.resolve(m.j);
  if(INFLIGHT.has(url))return INFLIGHT.get(url);
  const p=getJSON(url).then(j=>{MEM.set(url,{t:Date.now(),j});INFLIGHT.delete(url);return j},e=>{INFLIGHT.delete(url);if(m)return m.j;throw e});
  INFLIGHT.set(url,p);return p;
}
async function pool(tasks,n){const res=new Array(tasks.length);let i=0;
  await Promise.all(Array.from({length:Math.min(n,tasks.length)},async()=>{while(i<tasks.length){const k=i++;try{res[k]={ok:true,v:await tasks[k]()}}catch(e){res[k]={ok:false,e}}}}));return res}

/* ---------- Almacén de datos ---------- */
const TEAMS=store.get('pp_teams',{});      // clave "s:83" → {id,n,s,a,l,c,lks}
const LMETA=store.get('pp_lmeta',{});      // liga → {logo,season,seasonType,start,end}
const EV=new Map();                        // id → evento ligero
const LOADED={};                           // liga|mes → hora de carga
const S={tab:'home',stack:[],updated:store.get('pp_updated',0),boot:false,model:null,bt:null,liveLeagues:new Set(),offline:false};

function tkey(sport,id){return SP[sport]+':'+id}
function regTeam(t,lk){if(!t||!t.id)return null;const sport=lk.split('/')[0];const key=tkey(sport,t.id);
  const x=TEAMS[key]||(TEAMS[key]={id:String(t.id),k:key,sport,lks:[]});
  x.n=t.displayName||t.name||x.n||'—';x.s=t.shortDisplayName||t.name||x.s||x.n;x.a=t.abbreviation||x.a||(x.n||'').slice(0,3).toUpperCase();
  const lg=t.logo||(t.logos&&t.logos[0]&&t.logos[0].href);if(lg)x.l=lg;if(t.color)x.c=t.color;
  if(lk&&!x.lks.includes(lk))x.lks.push(lk);return key}
function statsOf(c){const o={};(c.statistics||[]).forEach(s=>{const v=num(s.displayValue);if(isFinite(v))o[s.name]=v});return o}
const scoreOf=x=>{const s=x&&x.score;return num(s&&typeof s==='object'?(s.value??s.displayValue):s)};
function minuteOf(d){const m=parseInt(String(d||'').replace(/[^0-9+]/g,''));return isFinite(m)?m:null}

function lean(e,lk){
  try{
    const c=e.competitions[0];const st=c.status||e.status;const T=st.type||{};
    const sport=lk.split('/')[0];
    if(sport==='racing')return leanF1(e,lk);
    const H=c.competitors.find(x=>x.homeAway==='home')||c.competitors[0],A=c.competitors.find(x=>x.homeAway==='away')||c.competitors[1];
    const ev={id:String(e.id),lk,d:Date.parse(e.date),s:T.state,sn:T.name||'',sd:T.shortDetail||T.detail||'',ck:st.displayClock||'',per:st.period||0,
      h:regTeam(H.team,lk),a:regTeam(A.team,lk),hs:scoreOf(H),as:scoreOf(A),v:(c.venue&&c.venue.fullName)||'',nt:((c.notes||[])[0]||{}).headline||''};
    if(sport==='soccer'){
      ev.hx=statsOf(H);ev.ax=statsOf(A);
      const hid=String(H.team.id);let hy=0,hr=0,ay=0,ar=0;const g=[];
      (c.details||[]).forEach(d=>{const side=d.team&&String(d.team.id)===hid?'h':'a';const m=minuteOf(d.clock&&d.clock.displayValue);
        const who=((d.athletesInvolved||[])[0]||{}).displayName||'';
        if(d.yellowCard){side==='h'?hy++:ay++}
        if(d.redCard){side==='h'?hr++:ar++}
        if(d.scoringPlay)g.push([side,m,who,d.penaltyKick?1:0,d.ownGoal?1:0,((d.athletesInvolved||[])[0]||{}).id||'']);
      });
      if(Array.isArray(c.details)){ev.cd=[hy,hr,ay,ar];ev.g=g;ev.fg=g.length?g.slice().sort((x,y)=>(x[1]??999)-(y[1]??999))[0][0]:(T.state==='post'?'n':null)}
    }else{
      const rec=x=>((x.records||[])[0]||{}).summary||'';ev.hr=rec(H);ev.ar=rec(A);
    }
    return ev;
  }catch(err){return null}
}
function leanF1(e,lk){
  const ses=(e.competitions||[]).map(c=>({t:(c.type&&(c.type.abbreviation||c.type.text))||'',d:Date.parse(c.date||c.startDate||e.date),s:c.status&&c.status.type&&c.status.type.state,
    res:(c.competitors||[]).slice().sort((a,b)=>(a.order||99)-(b.order||99)).slice(0,22).map(x=>[(x.athlete&&x.athlete.displayName)||'',(x.athlete&&x.athlete.flag&&x.athlete.flag.href)||'',x.order||'',x.winner?1:0])}));
  const race=ses.find(s=>/race/i.test(s.t))||ses[ses.length-1]||{};
  const st=e.status&&e.status.type||{};
  return{id:String(e.id),lk,d:Date.parse(e.date),name:e.name||e.shortName,s:race.s||st.state,sd:st.shortDetail||'',v:((e.circuit||{}).fullName)||'',ses,f1:1};
}
function saveMeta(j,lk){const L=(j.leagues||[])[0];if(!L)return;const m=LMETA[lk]||(LMETA[lk]={});
  if(L.logos&&L.logos[0])m.logo=L.logos[0].href;if(L.season){m.season=L.season.displayName;m.year=L.season.year;m.start=Date.parse(L.season.startDate);m.end=Date.parse(L.season.endDate);m.stype=L.season.type&&L.season.type.name}
  m.name=L.name||m.name}
function ingest(j,lk){saveMeta(j,lk);const out=[];(j.events||[]).forEach(e=>{const x=lean(e,lk);if(!x)return;const o=EV.get(x.id);
  if(o){for(const k of ['hx','ax'])if(!x[k]||!Object.keys(x[k]).length)x[k]=o[k];for(const k of ['cd','g','fg','v','nt'])if(x[k]==null||x[k]===''||(Array.isArray(x[k])&&!x[k].length&&o[k]&&o[k].length))x[k]=o[k];
    if(o.lk!==lk&&LEAGUES[o.lk]&&!LEAGUES[lk])x.lk=o.lk;if(!Number.isFinite(x.hs)&&Number.isFinite(o.hs)&&x.s===o.s){x.hs=o.hs;x.as=o.as}
    if(o.alt&&x.s==='in'&&Date.now()-o.alt.t<5*MIN&&x.hs<=o.hs&&x.as<=o.as&&x.hs+x.as<o.hs+o.as){x.hs=o.hs;x.as=o.as;x.alt=o.alt}}
  EV.set(x.id,x);out.push(x)});return out}

/* Consultas de calendario: ESPN acepta AAAAMM (mes) o AAAAMMDD (día), no rangos */
async function loadMonth(lk,month,ttl){const key=lk+'|'+month;
  const j=await api(`${SITE}${lk}/scoreboard?dates=${month}&limit=1000`,ttl??10*MIN);LOADED[key]=Date.now();return ingest(j,lk)}
async function loadDay(lk,day){const j=await api(`${SITE}${lk}/scoreboard?dates=${day}`,10e3);return ingest(j,lk)}
function monthsBetween(a,b){const out=[];const d=new Date(new Date(a).getFullYear(),new Date(a).getMonth(),1);while(d<=b){out.push(ym(d));d.setMonth(d.getMonth()+1)}return out}

/* Persistencia de eventos (para modo sin conexión y para el modelo) */
const PACK_V=3;
function persist(){
  const now=Date.now();const keep=[...EV.values()].filter(e=>!e.f1&&e.d>now-150*DAY&&e.d<now+40*DAY);
  const ok=store.set('pp_events',{v:PACK_V,t:now,e:keep});
  if(!ok){store.set('pp_events',{v:PACK_V,t:now,e:keep.filter(e=>e.d>now-70*DAY)})}
  store.set('pp_teams',TEAMS);store.set('pp_lmeta',LMETA);store.set('pp_updated',S.updated);
}

        if(C.f5h.n&&C.f5h.scoredPct<=.4)risk.push(`${hn} no marcó en ${C.f5h.n-Math.round(C.f5h.scoredPct*C.f5h.n)} de sus últimos ${C.f5h.n}.`);
        if(C.f5a.n&&C.f5a.scoredPct<=.4)risk.push(`${an} no marcó en ${C.f5a.n-Math.round(C.f5a.scoredPct*C.f5a.n)} de sus últimos ${C.f5a.n}.`)}
      if(C.f10h.csPct>=.5)risk.push(`${hn} dejó el arco en cero en ${pct(C.f10h.csPct)} de sus últimos partidos.`);
      if(C.f10a.csPct>=.5)risk.push(`${an} dejó el arco en cero en ${pct(C.f10a.csPct)} de sus últimos partidos.`)}
    else{if(tot<=2.3)fav.push(`El modelo espera un partido cerrado (${f1(tot)} goles).`);if(tot>=2.9)risk.push(`Se esperan ${f1(tot)} goles: partido con tendencia abierta.`)}
    if(m.grp==='fs'){const a1=C.f10h.fsPct,a2=C.f10a.fsPct;if(a1!=null&&a2!=null)args.push(`Marcó primero: ${hn} ${pct(a1)}, ${an} ${pct(a2)} de sus partidos con goles.`)}
    if(m.grp==='cs')risk.push('El resultado exacto casi nunca supera el 15%: probabilidad baja por naturaleza.');
  }
  if(m.grp==='cor'||m.grp==='card'){const k=m.grp==='cor'?'wonCorners':'cards';const s=P.stats.find(x=>x.k===k);const ah=m.grp==='cor'?C.corH:C.cardH,aa=m.grp==='cor'?C.corA:C.cardA;
    if(s&&!s.na)args.push(`Proyección: ${hn} ${f1(s.h)} · ${an} ${f1(s.a)} (total ${f1(s.t)}).`);
    if(ah&&aa)args.push(`Promedio reciente: ${hn} ${f1(ah.v)} (${ah.n} partidos), ${an} ${f1(aa.v)} (${aa.n} partidos).`);
    if(s&&(s.nh<5||s.na<5))risk.push('Pocos partidos con este dato para uno de los equipos: se completa con el promedio de la liga.');
    if(m.grp==='card')risk.push('Las tarjetas dependen mucho del árbitro, dato que la fuente no ofrece.');}
  return{fav,risk,args};
}

/* Nivel de confianza: probabilidad + cantidad de datos + rendimiento histórico del mercado */
function confidence(m,P){
  let lvl=m.p>=.72?2:m.p>=.58?1:0;const why=[];
  const n=Math.min(P.nH,P.nA);
  if(n<5){lvl=0;why.push('pocos datos de un equipo')}else if(n<9&&lvl>1){lvl=1;why.push('datos moderados')}
  if(m.grp==='cs'||m.grp==='draw')lvl=Math.min(lvl,0);
  if((m.grp==='cor'||m.grp==='card')){const s=P.stats.find(x=>x.k===(m.grp==='cor'?'wonCorners':'cards'));if(!s||s.na||s.nh<5||s.na<5)lvl=Math.min(lvl,0);else lvl=Math.min(lvl,1)}
  const cal=P.live?null:calibFor(m.grp,m.p);
  if(cal&&cal.n>=25){const hit=cal.k/cal.n;if(hit<m.p-.1&&lvl>0){lvl--;why.push('el historial de este mercado rinde por debajo de lo estimado')}}
  return{lvl:['baja','media','alta'][lvl],why,cal};
}
function calibFor(grp,p){const B=S.bt;if(!B||!B.cal||!B.cal[grp])return null;const b=Math.min(9,Math.floor(p*10));return B.cal[grp][b]||null}

/* ---------- Backtest: el modelo se evalúa en partidos pasados sin ver su resultado ---------- */
function runBacktest(weeks){
  weeks=weeks||8;const all=evs(e=>e.lk.startsWith('soccer/'));const now=Date.now();
  const start=new Date(now-weeks*7*DAY);start.setHours(0,0,0,0);
  const rows=[];const cal={};const byM={},byL={};let brier=0,brierBase=0,nb=0;
  for(let w=0;w<weeks;w++){
    const a=+start+w*7*DAY,b=a+7*DAY;const test=all.filter(e=>e.d>=a&&e.d<b&&isPlayed(e));if(!test.length)continue;
    const M=fitModel(all,a);if(M.n<150)continue;
    const base={};all.filter(e=>e.d<a&&isPlayed(e)).forEach(e=>{const x=base[e.lk]||(base[e.lk]={h:0,d:0,a:0,n:0});x.n++;e.hs>e.as?x.h++:e.hs===e.as?x.d++:x.a++});
    for(const e of test){
      if((M.cnt[e.h]||0)<3||(M.cnt[e.a]||0)<3)continue;
      const P=predictMatch(M,e.h,e.a,e.lk);const mk=markets(P,e);
      const o=[e.hs>e.as?1:0,e.hs===e.as?1:0,e.hs<e.as?1:0];
      brier+=(P.pH-o[0])**2+(P.pD-o[1])**2+(P.pA-o[2])**2;const bs=base[e.lk];
      if(bs&&bs.n>=10){const q=[bs.h/bs.n,bs.d/bs.n,bs.a/bs.n];brierBase+=(q[0]-o[0])**2+(q[1]-o[1])**2+(q[2]-o[2])**2}else brierBase+=(1/3-o[0])**2+(1/3-o[1])**2+(1/3-o[2])**2;nb++;
      const picks=[];
      for(const m of mk){const r=outcome(m.id,e);if(r==null)continue;
        const b2=Math.min(9,Math.floor(m.p*10));const c=(cal[m.grp]=cal[m.grp]||{});const cb=c[b2]||(c[b2]={n:0,k:0});cb.n++;if(r)cb.k++;
        const bm=byM[m.grp]||(byM[m.grp]={mk:m.mk,n:0,k:0,hi:0,hiK:0});bm.n++;if(r)bm.k++;if(m.p>=.65){bm.hi++;if(r)bm.hiK++}
        if(m.grp==='1x2'||m.grp==='ou25'||m.grp==='btts'||m.grp==='dc'){const bl=byL[e.lk]||(byL[e.lk]={n:0,k:0});bl.n++;if(r)bl.k++}
        picks.push({grp:m.grp,id:m.id,sel:m.sel,p:m.p,ok:r})}
      rows.push({id:e.id,d:e.d,lk:e.lk,h:e.h,a:e.a,hs:e.hs,as:e.as,picks});
    }
  }
  rows.sort((x,y)=>y.d-x.d);
  return{t:Date.now(),weeks,rows,cal,byM,byL,brier:nb?brier/nb:null,brierBase:nb?brierBase/nb:null,n:nb};
}

let TRACK=null,TRK_DIRTY=false;const trk=()=>TRACK||(TRACK=store.get('pp_tracked',{}));

function recordPicks(e,P,mk){
  if(e.s!=='pre'||e.d<Date.now())return;const R=trk();if(R[e.id])return;
  const keep=mk.filter(m=>['1x2','dc','ou25','btts'].includes(m.grp)).map(m=>({grp:m.grp,id:m.id,sel:m.sel,p:+m.p.toFixed(3),c:confidence(m,P).lvl}));
  R[e.id]={t:Date.now(),d:e.d,lk:e.lk,h:e.h,a:e.a,picks:keep};
  const ids=Object.keys(R);if(ids.length>400)ids.sort((x,y)=>R[x].d-R[y].d).slice(0,ids.length-400).forEach(k=>delete R[k]);
  TRK_DIRTY=true;
}
function trackedSummary(){const R=trk();const rows=[];let n=0,k=0;const byC={alta:{n:0,k:0},media:{n:0,k:0},baja:{n:0,k:0}};
  for(const id in R){const r=R[id];const e=EV.get(id);const res=r.picks.map(p=>{const o=e?outcome(p.id,e):null;if(o!=null){n++;if(o)k++;byC[p.c].n++;if(o)byC[p.c].k++}return Object.assign({},p,{ok:o})});
    rows.push(Object.assign({},r,{id,e,res}))}
  rows.sort((x,y)=>y.d-x.d);return{rows,n,k,byC}}

function espnPredictor(sum){const p=sum&&sum.predictor;if(!p||!p.homeTeam)return null;const h=num(p.homeTeam.gameProjection),a=num(p.awayTeam.gameProjection);return isFinite(h)&&isFinite(a)?{h:h/100,a:a/100}:null}

function lgCard(lk){const L=LEAGUES[lk];if(L.off)return`<button class="lgcard off" data-act="esports"><span class="ini">ES</span><div><b>${esc(L.name)}</b><small>No disponible en la fuente</small></div></button>`;

VIEWS.league=(p,tok)=>{
  const lk=p.lk,L=LEAGUES[lk],sport=L.sport,tab=p.tab||'matches';const m=LMETA[lk]||{};
  const tabs=sport==='racing'?[['matches','Carreras'],['table','Clasificación']]:sport==='soccer'?[['matches','Partidos'],['table','Tabla'],['scorers','Goleadores'],['teams','Equipos'],['stats','Estadísticas']]:[['matches','Partidos'],['table','Tabla'],['teams','Equipos'],['stats','Estadísticas']];
  const head=`${backBtn()}<div class="thead">${lgLogo(lk)?`<img src="${esc(lgLogo(lk))}" alt="">`:`<span class="ini">${esc(L.name.slice(0,2))}</span>`}<div><h2>${esc(L.name)}</h2><p>${esc(L.country||'')}${m.season?' · '+esc(m.season):''}${m.stype?' · '+esc(m.stype):''}${L.note?' · '+esc(L.note):''}</p></div></div>${tabsbar(tabs,tab,'ltab')}`;
  const now=Date.now();const cur=ym(now);
  const need=[cur];if(new Date().getDate()>20)need.push(ym(new Date(now+12*DAY)));
  const missing=need.filter(mm=>!LOADED[lk+'|'+mm]);
  if(missing.length&&!p._ld){p._ld=1;later(tok,Promise.all(missing.map(mm=>loadMonth(lk,mm))).then(()=>{p._ld=2}))}
  const lev=evs(e=>e.lk===lk);
  if(tab==='matches'){
    if(!lev.length&&p._ld!==2)return head+loadingHTML();
    const live=lev.filter(e=>e.s==='in').sort((a,b)=>a.d-b.d),up=lev.filter(e=>e.s==='pre'&&e.d>now-3*HOUR).sort((a,b)=>a.d-b.d).slice(0,30),res=lev.filter(e=>e.s==='post').sort((a,b)=>b.d-a.d).slice(0,30);
    return head+(live.length?`<div class="day" style="color:var(--live)">En vivo</div>${list(live)}`:'')+(up.length?`<div class="sec"><h3>Próximos</h3></div>${grouped(up)}`:'<div class="empty">No hay próximos partidos publicados.</div>')+(res.length?`<div class="sec"><h3>Resultados</h3></div>${list(res,{date:true})}`:'');
  }
  if(tab==='table'){
    const st=STAND[lk];if(!st&&!p._st){p._st=1;later(tok,loadStandings(lk).catch(e=>{p._ste=e.message}))}
    if(!st)return head+(p._ste?errHTML('La fuente no publicó la tabla: '+p._ste):loadingHTML('Cargando clasificación…'));
    if(!st.groups.length)return head+`<div class="empty">Esta competición no tiene tabla publicada (formato de eliminación directa o fase sin iniciar).</div>`;
    return head+st.groups.map(g=>`<section class="card"><h2>${esc(g.name||L.name)}</h2><div class="grid-wrap">${standTable(g,sport,lk)}</div></section>`).join('');
  }
  if(tab==='teams'){const ids=[...new Set(lev.flatMap(e=>[e.h,e.a]).concat(STAND[lk]?STAND[lk].groups.flatMap(g=>g.rows.map(r=>r.tk)).filter(Boolean):[]))].filter(x=>x&&TEAMS[x]).sort((a,b)=>T(a).n.localeCompare(T(b).n,'es'));
    if(!ids.length)return head+loadingHTML();
    return head+`<section class="card">${ids.map(tk=>`<button class="frow" data-team="${esc(tk)}"><div class="trow" style="flex:1">${logo(tk)}<span class="tn">${esc(T(tk).n)}</span></div>${isFav(tk)?'<span style="color:var(--accent)">★</span>':''}<span class="muted">›</span></button>`).join('')}</section>`}
  if(tab==='scorers'||tab==='stats'){
    const start=m.start||now-120*DAY;const months=monthsBetween(Math.max(start,now-330*DAY),new Date(now));const miss=months.filter(mm=>!LOADED[lk+'|'+mm]);
    if(miss.length&&!p._ss){p._ss=1;later(tok,pool(miss.map(mm=>()=>loadMonth(lk,mm,6*HOUR)),3).then(()=>{p._ss=2}))}
    if(miss.length&&p._ss!==2)return head+loadingHTML('Cargando la temporada completa…');
    const season=lev.filter(e=>isPlayed(e)&&e.d>=start);
    if(!season.length)return head+`<div class="empty">Aún no hay partidos jugados en esta temporada.</div>`;
    if(tab==='scorers'){const c={};season.forEach(e=>(e.g||[]).forEach(g=>{if(g[4]||!g[2])return;const tk=g[0]==='h'?e.h:e.a;const k=g[2]+'|'+tk;const x=c[k]||(c[k]={n:g[2],tk,id:g[5],g:0,p:0});x.g++;if(g[3])x.p++}));
      const top=Object.values(c).sort((a,b)=>b.g-a.g).slice(0,25);
      return head+`<section class="card"><h2>Máximos goleadores<small>${season.length} partidos</small></h2>${top.length?`<table><thead><tr><th class="l">#</th><th class="l">Jugador</th><th>Goles</th><th>Penal</th></tr></thead><tbody>${top.map((x,i)=>`<tr ${x.id?`data-player="${esc(x.id)}" data-ptk="${esc(x.tk)}"`:''} style="cursor:pointer"><td class="l">${i+1}</td><td class="l"><div class="trow">${logo(x.tk)}<span class="tn">${esc(x.n)}</span></div></td><td><b>${x.g}</b></td><td>${x.p||''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">La fuente no detalla los goleadores de esta competición.</div>'}
      <p class="muted small" style="margin:8px 0 0">Calculado con los goles registrados por ESPN en cada partido de la temporada (sin autogoles).</p></section>`}
    return head+leagueStats(season,sport,lk);
  }
  return head;
};
function standTable(g,sport,lk){
  if(sport==='racing')return`<table><thead><tr><th class="l">#</th><th class="l">${g.rows[0]&&g.rows[0].ath?'Piloto':'Escudería'}</th><th>Puntos</th></tr></thead><tbody>${g.rows.map(r=>`<tr><td class="l">${r.rank}</td><td class="l">${r.ath?`<div class="trow">${r.ath.f?`<img class="logo" src="${esc(r.ath.f)}" alt="">`:''}<span class="tn">${esc(r.ath.n)}</span></div>`:esc(r.team||T(r.tk).n)}</td><td><b>${esc(r.pts)}</b></td></tr>`).join('')}</tbody></table>`;
  if(sport==='soccer')return`<table><thead><tr><th class="l">#</th><th class="l">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>${g.rows.map(r=>`<tr data-team="${esc(r.tk)}"${isFav(r.tk)?' class="me"':''}><td class="l">${r.rank}</td><td class="l"><div class="trow">${logo(r.tk)}<span class="tn">${esc(T(r.tk).s)}</span></div></td><td>${esc(r.gp)}</td><td>${esc(r.w)}</td><td>${esc(r.d)}</td><td>${esc(r.l)}</td><td>${esc(r.gf)}</td><td>${esc(r.ga)}</td><td>${esc(r.gd)}</td><td><b>${esc(r.pts)}</b></td></tr>`).join('')}</tbody></table>`;
  return`<table><thead><tr><th class="l">#</th><th class="l">Equipo</th><th>G</th><th>P</th>${sport==='football'?'<th>E</th>':''}<th>%</th>${sport==='basketball'?'<th>Dif.</th>':''}<th>Racha</th></tr></thead><tbody>${g.rows.map((r,i)=>`<tr data-team="${esc(r.tk)}"${isFav(r.tk)?' class="me"':''}><td class="l">${i+1}</td><td class="l"><div class="trow">${logo(r.tk)}<span class="tn">${esc(T(r.tk).s)}</span></div></td><td>${esc(r.w)}</td><td>${esc(r.l)}</td>${sport==='football'?`<td>${esc(r.d)}</td>`:''}<td>${esc(r.pct)}</td>${sport==='basketball'?`<td>${esc(r.gb)}</td>`:''}<td>${esc(r.strk)}</td></tr>`).join('')}</tbody></table>`;
}
function leagueStats(season,sport,lk){
  const n=season.length;const goals=season.reduce((s,e)=>s+e.hs+e.as,0);
  const hw=season.filter(e=>e.hs>e.as).length,dr=season.filter(e=>e.hs===e.as).length,aw=n-hw-dr;
  const tile=(l,v)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  if(sport!=='soccer')return`<section class="card"><h2>Estadísticas de la temporada<small>${n} partidos</small></h2><div class="tiles">${tile('Puntos por partido',f1(goals/n))}${tile('Gana el local',pct(hw/n))}${tile('Gana el visitante',pct(aw/n))}</div></section>`;
  const btts=season.filter(e=>e.hs>0&&e.as>0).length,o25=season.filter(e=>e.hs+e.as>2).length;
  const avg=k=>{let s=0,c=0;season.forEach(e=>{const a=statVal(e,'h',k),b=statVal(e,'a',k);if(isFinite(a)&&isFinite(b)){s+=a+b;c++}});return c?f1(s/c):'—'};
  return`<section class="card"><h2>Estadísticas de la temporada<small>${n} partidos jugados</small></h2><div class="tiles">
  ${tile('Goles por partido',f2(goals/n))}${tile('Gana el local',pct(hw/n))}${tile('Empates',pct(dr/n))}${tile('Gana el visitante',pct(aw/n))}${tile('Ambos marcan',pct(btts/n))}${tile('Más de 2.5',pct(o25/n))}${tile('Córners por partido',avg('wonCorners'))}${tile('Tarjetas por partido',avg('cards'))}${tile('Remates por partido',avg('totalShots'))}</div></section>`;
}

  // Resumen
  const fs=formStats(tk,played.slice(0,10)),home=formStats(tk,played.filter(e=>e.h===tk).slice(0,10)),away=formStats(tk,played.filter(e=>e.a===tk).slice(0,10));
  const sr=lk?standingRow(lk,tk):null;let row=null;if(lk&&STAND[lk])for(const g of STAND[lk].groups){const r=g.rows.find(x=>x.tk===tk);if(r){row=r;break}}
  const tile=(l,v)=>`<div class="tile"><div class="l">${l}</div><div class="v${v==null||v===''?' na':''}">${v==null||v===''?'No disponible':v}</div></div>`;
  const soccer=sport==='soccer';
  const stA=k=>{const a=avgStat(tk,played.slice(0,10),k);return a?f1(a.v):null};const pos=avgPoss(tk,played.slice(0,10));
  return head+`<section class="card"><h2>Información</h2><div class="tiles">${tile('Competición',esc(lk?lgName(lk):''))}${tile('País',esc((LEAGUES[lk]&&LEAGUES[lk].country)||''))}${tile('Estadio',esc(info.venue||homeVenue||''))}${tile('Entrenador',esc(coach))}</div>
   ${info.standing?`<p class="muted" style="margin:10px 0 0">${esc(info.standing)}</p>`:''}</section>
  ${row?`<section class="card"><h2>Clasificación${sr&&sr.group?`<small>${esc(sr.group)}</small>`:''}</h2><div class="tiles">${tile('Posición',row.rank+'.º')}${soccer?tile('Puntos',esc(row.pts)):tile('% victorias',esc(row.pct))}${tile('Victorias',esc(row.w))}${soccer?tile('Empates',esc(row.d)):''}${tile('Derrotas',esc(row.l))}${soccer?tile('Goles a favor',esc(row.gf))+tile('Goles en contra',esc(row.ga))+tile('Diferencia',esc(row.gd)):''}</div></section>`:''}

function playerProps(e,P,j){
  const out=[];const pub=j&&(j.rosters||[]).some(r=>(r.roster||[]).length);
  for(const [side,tk,lam] of [['h',e.h,P.lh],['a',e.a,P.la]]){const R=ROSTER[tk];if(!R)continue;
    const gpg=formStats(tk,teamGames(tk,e.d,10)).gfa||lam;let starters=null;
    if(pub){const r=(j.rosters||[]).find(x=>tkey('soccer',x.team.id)===tk);if(r)starters=new Set((r.roster||[]).filter(x=>x.starter).map(x=>String(x.athlete&&x.athlete.id)))}
    R.athletes.forEach(a=>{const cats=(a.statistics&&a.statistics.splits&&a.statistics.splits.categories)||[];const g={};cats.forEach(c=>c.stats.forEach(s=>g[s.name]=num(s.value)));
      const app=g.appearances,gl=g.totalGoals;if(!(app>=5)||!(gl>=1))return;if(starters&&!starters.has(String(a.id)))return;
      const rate=gl/app*clamp(lam/Math.max(gpg,.3),.6,1.6);out.push({n:a.displayName,id:a.id,tk,p:1-Math.exp(-rate),gl,app})})}
  if(!out.length)return'';out.sort((a,b)=>b.p-a.p);
  return`<section class="card"><h2>Jugadores con más opción de marcar<small>${pub?'titulares confirmados':'según la plantilla'}</small></h2>${out.slice(0,6).map(x=>`<button class="frow" data-player="${esc(x.id)}" data-ptk="${esc(x.tk)}"><div class="trow" style="flex:1">${logo(x.tk)}<span class="tn">${esc(x.n)}</span></div><span class="muted small">${x.gl} goles en ${x.app} PJ</span><b style="font-family:var(--display);font-size:18px;margin-left:8px">${pct(x.p)}</b></button>`).join('')}

}

function nameSim(a,b){a=normN(a);b=normN(b);if(!a||!b)return 0;if(a===b||a.includes(b)||b.includes(a))return 1;
  const A=new Set(a.split(' ')),B=b.split(' ');let k=0;B.forEach(w=>{if(w.length>2&&A.has(w))k++});return k/Math.max(A.size,B.length)}

const PH=store.get('pp_ph',{});let PHQ=[],PHRUN=false;const SILH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="#5b6770"/><circle cx="20" cy="15" r="7" fill="#e9eef0"/><path d="M7 36a13 11 0 0 1 26 0z" fill="#e9eef0"/></svg>');
function phURL(id){const v=PH[id];return v&&v.u||''}

  while(PHQ.length){const q=PHQ.shift();if(PH[q.id]&&PH[q.id].u)continue;let u='';
    try{const j=await rawJSON('https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p='+encodeURIComponent(normN(q.name).replace(/ /g,'_')||q.name));
      const L=((j&&j.player)||[]).filter(p=>p.strSport==='Soccer');
      const hit=L.find(p=>nameSim(p.strTeam,q.team)>=.5)||(L.length===1?L[0]:null);
      if(hit)u=hit.strCutout||hit.strThumb||hit.strRender||'';PROVOK('tsdb');
    }catch(e){PROVERR('tsdb',e);q.tries=(q.tries||0)+1;if(q.tries<4)PHQ.push(q);await sleep(e.status===429?20000:5000);continue}
    PH[q.id]={u,t:Date.now()};store.set('pp_ph',PH);
    if(u)document.querySelectorAll(`img[data-phid="${q.id}"]`).forEach(im=>{im.src=u;im.classList.add('real')});
    await sleep(700)}
  PHRUN=false}
function phFallback(img,id,name,team){img.onerror=null;img.src=SILH;img.dataset.phid=id;const u=phURL(id);if(u){img.src=u;img.classList.add('real')}else wantPhoto(id,name,team)}

/* ---------- Alineación dibujada en el campo ---------- */
const POSD={G:0,GK:0,SW:1,CD:1,CB:1,RB:1.05,LB:1.05,RWB:1.3,LWB:1.3,WB:1.3,DM:2,CM:3,RM:3.1,LM:3.1,AM:4,RW:4.5,LW:4.5,F:5,CF:5,ST:5,SS:4.8};
function posInfo(x){const ab=String((x.position&&x.position.abbreviation)||'').toUpperCase();const base=ab.split('-')[0];
  const d=POSD[base]??3;let lat=0;if(/-L$/.test(ab))lat=-1;else if(/-R$/.test(ab))lat=1;if(/^L(B|M|W|WB)$/.test(base))lat=-2;if(/^R(B|M|W|WB)$/.test(base))lat=2;
  return{d,lat,fp:+x.formationPlace||99}}
function pitchLines(r){const st=(r.roster||[]).filter(x=>x.starter);if(st.length<7)return null;
  const info=new Map(st.map(x=>[x,posInfo(x)]));const gk=st.filter(x=>info.get(x).d===0);const keeper=gk[0]||st.slice().sort((a,b)=>info.get(a).fp-info.get(b).fp)[0];
  const out=st.filter(x=>x!==keeper).sort((a,b)=>info.get(a).d-info.get(b).d||info.get(a).fp-info.get(b).fp);
  let counts=String(r.formation||'').split('-').map(Number).filter(n=>n>0);
  if(counts.reduce((s,n)=>s+n,0)!==out.length){const groups={};out.forEach(x=>{const k=Math.round(info.get(x).d);groups[k]=(groups[k]||0)+1});counts=Object.keys(groups).sort((a,b)=>a-b).map(k=>groups[k])}
  const lines=[];let i=0;counts.forEach(n=>{lines.push(out.slice(i,i+n).sort((a,b)=>info.get(a).lat-info.get(b).lat||info.get(a).fp-info.get(b).fp));i+=n});
  return{keeper,lines}}
function playerFacts(x,tl){const st={};(x.stats||[]).forEach(s=>st[s.name]=num(s.value));const n=(x.athlete&&x.athlete.displayName)||'#';
  let off='',on='';tl.forEach(t=>{if(t.i!=='🔄'||!t.sub)return;if(t.sub.startsWith('Entra '+n+' ·'))on=t.m;if(t.sub.endsWith('sale '+n))off=t.m});
  return{g:st.totalGoals||0,og:st.ownGoals||0,as:st.goalAssists||0,y:st.yellowCards||0,r:st.redCards||0,off:x.subbedOut?(off||'✓'):'',on:x.subbedIn?(on||'✓'):''}}
function pCard(x,r,tl){const a=x.athlete||{};const f=playerFacts(x,tl);const id=a.id;const u=phURL(id);if(!u&&id)wantPhoto(id,a.displayName,r.team.displayName);
  const ic=[];if(f.off)ic.push(`<i class="b out" title="Sale ${esc(f.off)}">↓</i>`);
  const cards=(f.r?'<i class="b rc"></i>':'')+(f.y&&!f.r?'<i class="b yc"></i>':'');
  const g=f.g?`<i class="b gl">${'⚽'.repeat(Math.min(f.g,3))}</i>`:'';const asi=f.as?`<i class="b as" title="Asistencia">👟${f.as>1?f.as:''}</i>`:'';
  return`<button class="pc" data-player="${esc(id)}" data-ptk="${esc(tkey('soccer',r.team.id))}"><span class="ph"><img src="${esc(u||SILH)}" data-phid="${esc(id)}" class="${u?'real':''}" alt="" loading="lazy" onerror="this.onerror=null;this.src=SILH">${ic.join('')}${cards}${g}${asi}</span><span class="no">${esc(x.jersey||'–')}</span><span class="nm">${esc(a.shortName||a.displayName||'')}</span></button>`}
function pitchHTML(e,j){
  const R=j.rosters||[];const H=R.find(r=>r.homeAway==='home')||R[0],A=R.find(r=>r.homeAway==='away')||R[1];if(!H||!A)return'';
  const LH=pitchLines(H),LA=pitchLines(A);if(!LH||!LA)return'';const tl=timeline(e,j);
  const place=(L,r,top)=>{let h='';const n=L.lines.length;const span=39;
    h+=`<div class="pr" style="top:${top?6:94}%">${pCard(L.keeper,r,tl)}</div>`;
    L.lines.forEach((line,i)=>{const y=top?6+(i+1)*span/n:94-(i+1)*span/n;const row=top?line.slice().reverse():line;
      h+=`<div class="pr" style="top:${y.toFixed(1)}%">${row.map(x=>pCard(x,r,tl)).join('')}</div>`});return h};
  const bar=(r,cls)=>`<div class="pbar2 ${cls}"><span class="trow">${logo(tkey('soccer',r.team.id))}<b>${esc(r.team.displayName)}</b></span>${r.formation?`<span class="fm">${esc(r.formation)}</span>`:''}</div>`;
  return`<div class="pitch-wrap">${bar(H,'top')}<div class="pitch"><div class="pl-lines"><i class="half"></i><i class="circ"></i><i class="box t"></i><i class="box b"></i><i class="six t"></i><i class="six b"></i><i class="arc t"></i><i class="arc b"></i></div>${place(LH,H,true)}${place(LA,A,false)}</div>${bar(A,'bot')}</div>`}
function benchHTML(e,j){const R=j.rosters||[];const tl=timeline(e,j);
  const side=r=>{if(!r)return'';const bn=(r.roster||[]).filter(x=>!x.starter);const used=bn.filter(x=>x.subbedIn),rest=bn.filter(x=>!x.subbedIn);
    const row=x=>{const f=playerFacts(x,tl);const a=x.athlete||{};
      let rep='';if(f.on){const t=tl.find(t=>t.i==='🔄'&&t.sub&&t.sub.startsWith('Entra '+a.displayName+' ·'));if(t)rep=t.sub.split('sale ')[1]||''}
      return`<button class="pl" data-player="${esc(a.id)}" data-ptk="${esc(tkey('soccer',r.team.id))}"><span class="no">${esc(x.jersey||'')}</span><span class="pn">${esc(a.displayName)}${rep?`<small class="muted"> por ${esc(rep)}</small>`:''}</span><span class="tag">${f.on?`<b style="color:var(--ok)">↑${esc(f.on)}</b> `:''}${f.g?'⚽'.repeat(f.g):''}${f.y?'🟨':''}${f.r?'🟥':''}</span></button>`};
    return`<div><h4>${esc(r.team.displayName)}</h4>${used.map(row).join('')}${rest.map(row).join('')||(!used.length?'<div class="muted small">—</div>':'')}</div>`};

const PROV={espn:{n:'ESPN (principal)'},espn2:{n:'ESPN espejo (site.web.api)'},oldb:{n:'OpenLigaDB (Bundesliga)'},fd:{n:'football-data.org (tu clave)'},tsdb:{n:'TheSportsDB (fotos)'}};
function PROVOK(k){if(PROV[k])Object.assign(PROV[k],{ok:Date.now(),err:''})}
function PROVERR(k,e){if(PROV[k])Object.assign(PROV[k],{fail:Date.now(),err:(e&&e.message)||'error'})}
const FD_MAP={PL:'soccer/eng.1',PD:'soccer/esp.1',SA:'soccer/ita.1',BL1:'soccer/ger.1',FL1:'soccer/fra.1',CL:'soccer/uefa.champions',ELC:'soccer/eng.2',BSA:'soccer/bra.1',DED:'soccer/ned.1',PPL:'soccer/por.1',CLI:'soccer/conmebol.libertadores'};
function applyAlt(e,hs,as,src){if(!e||e.s!=='in'||!Number.isFinite(hs)||!Number.isFinite(as))return false;
  if(!(hs>=e.hs&&as>=e.as&&hs+as>e.hs+e.as))return false;
  const prev=Object.assign({},e);e.hs=hs;e.as=as;e.alt={src,t:Date.now()};detectChanges(prev,e);flashScore(e);return true}
function matchAlt(list,lk,hN,aN,kick){const sim=(t,ns)=>Math.max(...[].concat(ns).map(n=>Math.max(nameSim(T(t).n,n),nameSim(T(t).s,n))));
  return list.filter(x=>x.lk===lk).find(x=>{const dt=Math.abs(x.d-kick);if(dt>3*HOUR)return false;const a=sim(x.h,hN),b=sim(x.a,aN);return(a>=.5&&b>=.5)||(Math.max(a,b)>=1&&dt<20*MIN)})}
async function altTick(){let n=0;const live=evs(e=>e.s==='in'&&!e.f1);if(!live.length)return 0;
  if(live.some(e=>e.lk==='soccer/ger.1')){try{const j=await rawJSON('https://api.openligadb.de/getmatchdata/bl1');PROVOK('oldb');
      (j||[]).forEach(m=>{if(m.matchIsFinished)return;const gl=(m.goals||[]).slice(-1)[0];const hs=gl?gl.scoreTeam1:0,as=gl?gl.scoreTeam2:0;
        const e=matchAlt(live,'soccer/ger.1',m.team1&&m.team1.teamName,m.team2&&m.team2.teamName,Date.parse(m.matchDateTimeUTC));if(e&&applyAlt(e,hs,as,'OpenLigaDB'))n++})}catch(err){PROVERR('oldb',err)}}
  const fk=store.get('fdk','');const fdL=new Set(Object.values(FD_MAP));
  if(fk&&live.some(e=>fdL.has(e.lk))){try{const r=await fetch('https://api.football-data.org/v4/matches?status=IN_PLAY,PAUSED',{headers:{'X-Auth-Token':fk}});
      const j=await r.json();if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));PROVOK('fd');
      (j.matches||[]).forEach(m=>{const lk=FD_MAP[m.competition&&m.competition.code];if(!lk)return;const sc=(m.score&&m.score.fullTime)||{};
        const e=matchAlt(live,lk,[m.homeTeam&&m.homeTeam.shortName,m.homeTeam&&m.homeTeam.name].filter(Boolean),[m.awayTeam&&m.awayTeam.shortName,m.awayTeam&&m.awayTeam.name].filter(Boolean),Date.parse(m.utcDate));
        if(e&&applyAlt(e,+sc.home,+sc.away,'football-data.org'))n++})}catch(err){PROVERR('fd',err)}}
  return n}
function altBadge(e){return e&&e.alt?`<div class="altb">⚡ Marcador adelantado por ${esc(e.alt.src)} · ESPN aún no lo confirma</div>`:''}
function provHTML(){const t=x=>x?ago(x):'—';
  return Object.entries(PROV).map(([k,p])=>{const st=p.ok&&(!p.fail||p.ok>p.fail)?'ok':p.fail?'ko':'pend';
    const why=k==='fd'&&!store.get('fdk','')?'sin clave':k==='oldb'&&!p.ok&&!p.fail?'se usa cuando hay Bundesliga en vivo':st==='ko'?p.err:st==='ok'?'respondió '+t(p.ok):'en espera';
    return`<div class="frow"><span class="small">${esc(p.n)}</span><span class="res ${st}">${esc(why)}</span></div>`}).join('')}

/* Cambios entre dos lecturas del marcador → avisos. Goles y rojas se confirman en la lectura siguiente para no avisar algo que la fuente corrige. */
const PEND={};
function detectChanges(prev,e){
  if(!(isFav(e.h)||isFav(e.a))||!e.lk.startsWith('soccer/')&&!e.lk.startsWith('basketball/')&&!e.lk.startsWith('football/'))return;
  const fh=isFav(e.h);const mine=fh?e.h:e.a;const id=e.id;const soccer=e.lk.startsWith('soccer/');
  if(prev&&prev.s==='pre'&&e.s==='in'&&NT.start)notify('start|'+id,'🔔 ¡COMIENZA EL PARTIDO!',`${T(e.h).n} vs ${T(e.a).n}\nEl partido acaba de comenzar.`,id);
  if(prev&&prev.s==='pre'&&e.s==='pre'&&Math.abs(prev.d-e.d)>10*MIN&&NT.change){notify('resched|'+id+'|'+e.d,'📅 Partido reprogramado',`${T(e.h).n} vs ${T(e.a).n}\nNueva hora: ${fmtDate(e.d)} ${fmtTime(e.d)}`,id);syncScheduled()}
  if(prev&&!/POSTPONED|SUSPENDED|CANCELED|DELAYED/.test(prev.sn)&&/POSTPONED|SUSPENDED|CANCELED|DELAYED/.test(e.sn)&&NT.change){const w=/POSTPONED/.test(e.sn)?'aplazado':/CANCELED/.test(e.sn)?'cancelado':'suspendido';notify('susp|'+id+'|'+e.sn,`⚠️ Partido ${w}`,`${T(e.h).n} vs ${T(e.a).n}`,id)}
  if(soccer&&e.s==='in'&&/HALFTIME/.test(e.sn)&&NT.half)notify('half|'+id,'⏸️ Final del primer tiempo',vsLine(e),id);
  if(prev&&prev.s==='in'&&e.s==='post'&&NT.final)notify('final|'+id,'🏁 Final del partido',vsLine(e),id);
  if(!soccer||e.s!=='in')return;
  const p=PEND[id];const cur={hs:e.hs,as:e.as,cd:(e.cd||[0,0,0,0]).join(',')};
  if(p&&p.hs===cur.hs&&p.as===cur.as&&p.cd===cur.cd&&!p.done){p.done=1;
    const ph=p.base.hs,pa=p.base.as;
    for(let g=ph+1;g<=cur.hs;g++)goalNotice(e,'h',g,mine);
    for(let g=pa+1;g<=cur.as;g++)goalNotice(e,'a',g,mine);
    const b=(p.base.cd||'0,0,0,0').split(',').map(Number),c=cur.cd.split(',').map(Number);
    if(NT.red){if(c[1]>b[1])notify(`red|${id}|h${c[1]}`,'🟥 Tarjeta roja',`${T(e.h).n} · ${vsLine(e)} · ${e.ck}`,id);if(c[3]>b[3])notify(`red|${id}|a${c[3]}`,'🟥 Tarjeta roja',`${T(e.a).n} · ${vsLine(e)} · ${e.ck}`,id)}
    if(NT.yellow){if(c[0]>b[0])notify(`yel|${id}|h${c[0]}`,'🟨 Tarjeta amarilla',`${T(e.h).n} · ${e.ck}`,id);if(c[2]>b[2])notify(`yel|${id}|a${c[2]}`,'🟨 Tarjeta amarilla',`${T(e.a).n} · ${e.ck}`,id)}
  }
  const base=prev&&prev.s==='in'?{hs:prev.hs||0,as:prev.as||0,cd:(prev.cd||[0,0,0,0]).join(',')}:null;
  if(base&&(base.hs!==cur.hs||base.as!==cur.as||base.cd!==cur.cd))PEND[id]={hs:cur.hs,as:cur.as,cd:cur.cd,base:(p&&!p.done)?p.base:base};
}
function goalNotice(e,side,n,mine){const tk=side==='h'?e.h:e.a;const forMe=tk===mine;if(forMe&&!NT.goal)return;if(!forMe&&!NT.against)return;
  const sc=((e.g||[]).filter(x=>x[0]===side)[n-1]||[])[2]||'';
  notify(`goal|${e.id}|${side}${n}`,forMe?`⚽ ¡GOOOOOOL DEL ${T(tk).n.toUpperCase()}!`:`⚽ Gol de ${T(tk).n}`,`${vsLine(e)}\nMinuto ${e.ck||'—'}${sc?' · '+sc:''}`,e.id)}

const LIVE_MS=15000;let LTIMER=null,LASTMONTH=Date.now();
async function liveTick(){
  clearTimeout(LTIMER);const now=Date.now();
  const act=new Map();for(const e of EV.values()){if(e.f1)continue;const soon=e.s==='pre'&&e.d<now+3*MIN&&e.d>now-6*HOUR;if(e.s==='in'||soon){const days=act.get(e.lk)||new Set();days.add(ymd(e.d));act.set(e.lk,days)}}
  if(act.size){const tasks=[];act.forEach((days,lk)=>days.forEach(dd=>tasks.push(async()=>{const prev={};evs(x=>x.lk===lk).forEach(x=>prev[x.id]=Object.assign({},x));
      const got=await loadDay(lk,dd);got.forEach(e=>{const pv=prev[e.id];detectChanges(pv,e);if(pv&&(pv.hs!==e.hs||pv.as!==e.as))flashScore(e)})})));
    const r=await pool(tasks,4);const okN=r.filter(x=>x.ok).length;try{await altTick()}catch(e){}S.offline=!okN&&!navigator.onLine;if(okN){S.updated=Date.now();updStatus()}
    followedSummaries();liveBadge();if(['home','live','league','fav'].includes(S.cur.v))render(true);}
  if(now-LASTMONTH>30*MIN){LASTMONTH=now;refreshMonths().catch(()=>{})}
  const nextKick=evs(e=>e.s==='pre'&&e.d>now).reduce((m,e)=>Math.min(m,e.d),Infinity);
  const wait=act.size?(document.hidden?60e3:LIVE_MS):clamp(nextKick-now-2*MIN,30e3,10*MIN);
  LTIMER=setTimeout(liveTick,wait);
}

async function refreshMonths(force){
  const now=new Date();const cur=ym(now);const months=[cur];if(now.getDate()>20)months.push(ym(new Date(+now+12*DAY)));
  const lks=Object.values(LEAGUES).filter(l=>!l.off).map(l=>l.k);
  const tasks=[];lks.forEach(lk=>{const sport=lk.split('/')[0];
    if(sport==='basketball'||sport==='football'){[0,1,2].forEach(i=>tasks.push(()=>loadDay(lk,ymd(+now+i*DAY))));tasks.push(()=>loadDay(lk,ymd(+now-DAY)))}
    else months.forEach(m=>tasks.push(()=>loadMonth(lk,m,force?0:5*MIN)))});
  const r=await pool(tasks,5);const ok=r.filter(x=>x.ok).length;
  if(!ok)throw new Error(LASTERR||'sin respuesta');S.updated=Date.now();S.offline=false;persist();return ok;
}
async function loadHistory(force){
  const last=store.get('pp_hist_t',0);if(!force&&Date.now()-last<8*HOUR&&evs(e=>e.s==='post').length>300)return false;
  const now=new Date();const months=monthsBetween(new Date(+now-125*DAY),new Date(+now-DAY*1)).filter(m=>m!==ym(now));
  const tasks=[];SOCCER.forEach(lk=>months.forEach(m=>tasks.push(()=>loadMonth(lk,m,12*HOUR))));
  const r=await pool(tasks,5);if(r.some(x=>x.ok)){store.set('pp_hist_t',Date.now());persist();return true}return false;
}
let BTT=null;function scheduleBT(ms){clearTimeout(BTT);BTT=setTimeout(()=>{try{S.bt=runBacktest(8)}catch(e){console.warn('bt',e)}if(S.cur.v==='history'||S.cur.v==='match')render(true)},ms??2500)}
function refit(){const t0=performance.now();S.model=fitModel(evs(e=>e.lk.startsWith('soccer/')));S.fitMs=Math.round(performance.now()-t0);scheduleBT()}
function hideSplash(){const s=$('#splash');if(!s||s.hidden)return;s.style.opacity='0';setTimeout(()=>s.hidden=true,350)}
async function boot(){
  applyTheme();S.cur={v:'home',p:{}};
  const restored=restore();if(restored){S.boot=true;refit();render(false);hideSplash();updStatus()}
  setTimeout(hideSplash,9000);
  $('#refresh').classList.add('spin');
  try{await refreshMonths();S.lastErr=''}catch(e){S.lastErr=e.message;S.offline=true}
  S.boot=true;$('#refresh').classList.remove('spin');refit();hideSplash();updStatus();liveBadge();render(true);
  try{if(await loadHistory()){refit();render(true)}}catch(e){}
  if(isNative()){try{const ln=LN();if(ln){const s=await ln.checkPermissions();NPERM=s.display;store.set('pp_nperm',NPERM);if(NPERM==='granted'){try{await ln.createChannel({id:'partidos',name:'Partidos de mis equipos',description:'Goles, tarjetas, inicio y final',importance:5,visibility:1,vibration:true})}catch(e){}syncScheduled()}
    ln.addListener&&ln.addListener('localNotificationActionPerformed',a=>{const id=a&&a.notification&&a.notification.extra&&a.notification.extra.eid;if(id&&EV.get(id))go('match',{id})})}}catch(e){}}
  liveTick();
}
function applyTheme(){const v=store.get('theme','auto');if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v)}

/* =========================================================
   EVENTOS DE LA INTERFAZ
   ========================================================= */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button,tr[data-team],tr[data-player]');if(!b)return;const d=b.dataset;
  if(d.tab){setTab(d.tab);return}
  if(d.tabGo){setTab(d.tabGo);return}
  if(d.fav){ev.stopPropagation();toggleFav(d.fav);render(true);return}
  if(d.match){go('match',{id:d.match,tab:d.tabsel});return}
  if(d.league){go('league',{lk:d.league});return}
  if(d.player){if(d.player&&d.player!=='undefined')go('player',{id:d.player,tk:d.ptk});return}
  if(d.team){if(TEAMS[d.team])go('team',{tk:d.team});return}
  const P=S.cur.p;
  if(d.ltab){P.tab=d.ltab;render(true);return}
  if(d.ttab){P.tab=d.ttab;render(true);return}
  if(d.mtab){P.tab=d.mtab;render(true);return}
  if(d.htab){P.tab=d.htab;render(true);return}
  if(d.livef){P.f=d.livef;render(true);return}
  if(d.pf){P[d.pf]=d.pf==='h'?+d.v:d.v;render(true);return}
  if(d.themeSet){store.set('theme',d.themeSet);applyTheme();render(true);return}
  switch(d.act||b.id){
    case'back':history.length>1?history.back():back();break;
    case'refresh':case'retry':$('#refresh').classList.add('spin');MEM.clear();refreshMonths(true).then(()=>{S.lastErr='';refit();Object.keys(P).forEach(k=>{if(k.startsWith('_'))delete P[k]})}).catch(e=>{S.lastErr=e.message;toast('No se pudo actualizar: '+e.message)}).finally(()=>{$('#refresh').classList.remove('spin');updStatus();render(true)});break;
    case'history':go('history',{});break;
    case'esports':go('esports',{});break;
    case'ai':runAI(d.key);break;
    case'savekey':store.set('ak',$('#ak').value.trim());store.set('am',$('#am').value.trim()||'claude-sonnet-5-5');toast('Clave guardada en este teléfono');break;
    case'testkey':testAI();break;
    case'savefd':store.set('fdk',$('#fdk').value.trim());toast('Clave de football-data.org guardada');render(true);break;
    case'clearfd':store.set('fdk','');toast('Clave borrada');render(true);break;
    case'clearkey':store.set('ak','');$('#ak').value='';toast('Clave borrada');break;
    case'clearcache':['pp_events','pp_hist_t','pp_lmeta','pp_teamlists_t'].forEach(store.del);EV.clear();MEM.clear();Object.keys(LOADED).forEach(k=>delete LOADED[k]);toast('Caché borrada. Recargando…');boot();break;
    case'notifperm':askNotifPermission(false).then(r=>{toast(r==='granted'?'Notificaciones activadas':'Permiso no concedido: actívalo en Ajustes de Android → Apps → P-PRONOSTICOS');render(true)});break;
    case'notiftest':askNotifPermission(true).then(()=>{store.set('pp_notified',Object.assign(store.get('pp_notified',{}),{['test|'+Date.now()]:0}));notify('test|'+Date.now(),'⚽ ¡GOOOOOOL! (prueba)','Así llegarán los avisos de tus equipos.')});break;
    case'loadteams':b.disabled=true;b.textContent='Cargando…';loadAllTeams().then(()=>toast('Lista de equipos actualizada')).catch(()=>toast('No se pudo cargar la lista completa')).finally(()=>render(true));break;
  }
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.nt){NT[t.dataset.nt]=t.checked?1:0;store.set('pp_nt',NT);if(['start','remind'].includes(t.dataset.nt))syncScheduled()}});
document.addEventListener('input',ev=>{if(ev.target.id==='favq'){S.cur.p.q=ev.target.value;const pos=ev.target.selectionStart;render(true);const i=$('#favq');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}}});
window.addEventListener('popstate',()=>{if(S.stack.length)back();else if(S.cur.v!=='home')setTab('home')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(LTIMER);liveTick()}});
window.addEventListener('online',()=>{S.offline=false;liveTick()});window.addEventListener('offline',()=>{S.offline=true;updStatus();render(true)});
boot();
</script>
</body>
</html>
